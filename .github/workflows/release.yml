name: release

# A version tag publishes the package to npm (trusted publishing, no token), builds the MCP Bundle,
# attaches it to the GitHub release and publishes server.json to the official MCP Registry.
# The registry checks that the npm version exists, so npm goes first and a failure there stops the run.
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its files
      id-token: write # OIDC login to npm (trusted publishing) and to the MCP Registry
    env:
      MCP_PUBLISHER_VERSION: v1.8.16
      # Trusted publishing needs npm 11.5.1 or newer and Node 22.14 or newer. Node 22 ships npm 10.
      NPM_CLI_VERSION: 11.6.2
      NPM_PACKAGE: booksy-biz-mcp
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build the MCP Bundle and the extension zip
        run: node scripts/build-mcpb.mjs
      - name: Bundle answers initialize and tools/list
        run: node scripts/smoke-stdio.mjs node build/mcpb/dist/index.js
      - name: Publish to npm unless this version is already there
        run: |
          set -euo pipefail
          published="$(npm view "$NPM_PACKAGE@$VERSION" version 2> /dev/null || true)"
          if [ "$published" = "$VERSION" ]; then
            echo "$NPM_PACKAGE@$VERSION is already on npm, skipping npm publish"
            exit 0
          fi
          # The checks and the build ran above, so prepublishOnly is skipped.
          if ! npx --yes "npm@$NPM_CLI_VERSION" publish --provenance --access public --ignore-scripts; then
            echo "::error title=npm publish failed::$NPM_PACKAGE@$VERSION was not published to npm, so nothing was released and nothing was sent to the MCP Registry. Trusted publishing (OIDC) needs a trusted publisher for this package on npmjs.com: package Settings, Trusted Publisher, GitHub Actions, user PiotrZapolski, repository booksy-mcp, workflow release.yml, no environment, with 'npm publish' allowed. Add it and rerun this workflow, or publish $VERSION by hand and rerun."
            exit 1
          fi
      - name: npm serves this version
        run: |
          set -euo pipefail
          for _ in 1 2 3 4 5 6; do
            if [ "$(npm view "$NPM_PACKAGE@$VERSION" version 2> /dev/null || true)" = "$VERSION" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error title=npm version missing::$NPM_PACKAGE@$VERSION is not visible on npm yet. Rerun this workflow in a few minutes: the MCP Registry rejects a version npm does not serve."
          exit 1
      - name: GitHub release with the files
        run: |
          set -euo pipefail
          bundle="booksy-mcp-$VERSION.mcpb"
          extension="booksy-mcp-extension-$VERSION.zip"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
          mkdir published
          # A rerun keeps the bundle that is already public, so its hash in the registry stays true.
          if gh release download "$TAG" --pattern "$bundle" --dir published; then
            echo "Release $TAG already has $bundle, keeping it"
          else
            gh release upload "$TAG" "build/$bundle"
            cp "build/$bundle" published/
          fi
          gh release upload "$TAG" "build/$extension" --clobber
          node scripts/release-server-json.mjs "published/$bundle" published/server.json
          gh release upload "$TAG" published/server.json --clobber
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Publish to the MCP Registry
        run: |
          set -euo pipefail
          ./mcp-publisher validate published/server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish published/server.json
